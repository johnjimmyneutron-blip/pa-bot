name: ABD açılış botu

on:
  schedule:
    # GitHub zamanlamaları UTC'dir. Bot, açılışa 40 dk'dan fazla varsa kendiliğinden çıkar;
    # bu yüzden yaz ve kış saati için iki zamanlama var, her gün yalnızca doğru olan çalışır.
    - cron: "5 13 * * 1-5"   # Yaz saati (Mart–Kasım): ABD açılışı 13:30 UTC = 16:30 TR
    - cron: "5 14 * * 1-5"   # Kış saati (Kasım–Mart): ABD açılışı 14:30 UTC = 17:30 TR
  workflow_dispatch:
    inputs:
      test:
        description: "Test modu (saat kontrolü yok, hemen tara ve bir kez kontrol et)"
        type: boolean
        default: true

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tarama ve takip
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.test }}" = "true" ]; then
            python acilis_botu.py --piyasa sp500 --saf --test
          else
            python acilis_botu.py --piyasa sp500 --saf
          fi
