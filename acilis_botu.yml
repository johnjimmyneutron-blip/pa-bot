name: ABD açılış botu

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Test modu (saat kontrolü yok, hemen tara ve bir kez kontrol et)"
        type: boolean
        default: true
      piyasa:
        description: "Taranacak piyasa"
        type: choice
        options: [sp500, nasdaq100]
        default: sp500

# Her piyasa kendi kuyruğunda: S&P 500 ve Nasdaq-100 aynı anda, birbirini beklemeden çalışır
concurrency:
  group: acilis-botu-${{ inputs.piyasa || 'sp500' }}
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tarama ve takip
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PIYASA: ${{ inputs.piyasa || 'sp500' }}
          TEST: ${{ inputs.test }}
        run: |
          if [ "$TEST" = "true" ]; then
            python acilis_botu.py --piyasa "$PIYASA" --saf --test
          else
            python acilis_botu.py --piyasa "$PIYASA" --saf
          fi
