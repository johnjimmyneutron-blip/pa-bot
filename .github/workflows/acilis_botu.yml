name: ABD açılış botu

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Test modu (saat kontrolü yok, hemen tara ve bir kez kontrol et)"
        type: boolean
        default: true

concurrency:
  group: acilis-botu
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tarama ve takip
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.test }}" = "true" ]; then
            python acilis_botu.py --piyasa sp500 --saf --test
          else
            python acilis_botu.py --piyasa sp500 --saf
          fi
