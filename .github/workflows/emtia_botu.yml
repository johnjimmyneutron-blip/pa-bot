name: Emtia ve döviz botu

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Test modu (hemen tara ve kontrol et, durum dosyasına yazma)"
        type: boolean
        default: true

# Durum dosyasını depoya geri kaydetmek için yazma izni
permissions:
  contents: write

# Aynı anda tek çalıştırma: durum dosyası çakışmasın
concurrency:
  group: emtia-botu
  cancel-in-progress: false

jobs:
  calis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tarama ve takip
        env:
          # Ayrı sohbet için ayrı bot; tanımlı değilse ana bota düşer
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_EMTIA || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_EMTIA || secrets.TELEGRAM_CHAT_ID }}
          TEST: ${{ inputs.test }}
        run: |
          if [ "$TEST" = "true" ]; then
            python emtia_botu.py --test
          else
            python emtia_botu.py
          fi
      - name: Durumu kaydet
        if: ${{ inputs.test != true }}
        run: |
          git config user.name "pa-bot"
          git config user.email "pa-bot@users.noreply.github.com"
          git add durum/ || true
          if git diff --cached --quiet; then echo "Değişiklik yok."; exit 0; fi
          git commit -m "Emtia durum güncellemesi"
          for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && exit 0; sleep 5; done
          exit 1
